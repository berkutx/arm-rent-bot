name: svoi-test
services:
  app:
    image: svoi:0.5.0-test
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8000"
    volumes:
      - svoi-data:/app/data
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
volumes:
  svoi-data:
